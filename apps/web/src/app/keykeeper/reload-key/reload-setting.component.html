<bit-form-control>
  <input
    type="checkbox"
    bitCheckbox
    [formControl]="stay"
    id="keykeeperStayUnlockedOnReload"
    data-testid="keykeeper-stay-unlocked-on-reload"
  />
  <bit-label>Stay unlocked when I reload</bit-label>
  <bit-hint>{{ note() ?? hint }}</bit-hint>
</bit-form-control>
