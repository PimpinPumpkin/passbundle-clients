<!-- Keykeeper: iconOnly is the vault page's New, a + beside the search (DESIGN.md, "The look"). -->
@if (useNewItemDialog()) {
  @if (iconOnly()) {
    <button
      bitIconButton="bwi-plus"
      buttonType="primary"
      type="button"
      (click)="navigateToNewItemPage()"
      [disabled]="!canCreateCipher()"
      [label]="(btnTextAddCreateFeatureFlag() ? 'add' : 'new') | i18n"
      [bitTooltip]="!canCreateCipher() ? ('organizationIsDeactivated' | i18n) : ''"
      data-testid="new-item-button"
    ></button>
  } @else {
    <button
      bitButton
      buttonType="primary"
      type="button"
      (click)="navigateToNewItemPage()"
      [disabled]="!canCreateCipher()"
      [bitTooltip]="!canCreateCipher() ? ('organizationIsDeactivated' | i18n) : ''"
      startIcon="bwi-plus"
    >
      {{ (btnTextAddCreateFeatureFlag() ? "add" : "new") | i18n }}
    </button>
  }
} @else {
  @if (iconOnly()) {
    <button
      bitIconButton="bwi-plus"
      buttonType="primary"
      type="button"
      [bitMenuTriggerFor]="itemOptions"
      [disabled]="!canCreateCipher()"
      [label]="(btnTextAddCreateFeatureFlag() ? 'add' : 'new') | i18n"
      [bitTooltip]="!canCreateCipher() ? ('organizationIsDeactivated' | i18n) : ''"
      data-testid="new-item-button"
    ></button>
  } @else {
    <button
      bitButton
      startIcon="bwi-plus"
      [bitMenuTriggerFor]="itemOptions"
      buttonType="primary"
      type="button"
      [disabled]="!canCreateCipher()"
      [bitTooltip]="!canCreateCipher() ? ('organizationIsDeactivated' | i18n) : ''"
    >
      {{ (btnTextAddCreateFeatureFlag() ? "add" : "new") | i18n }}
    </button>
  }
  <bit-menu #itemOptions>
    @for (menuItem of cipherMenuItems$ | async; track menuItem.type) {
      <a bitMenuItem [routerLink]="['/add-cipher']" [queryParams]="buildQueryParams(menuItem.type)">
        <!-- Keykeeper: each kind's jewel tile, as in the list -->
        <vault-keykeeper-category-tile
          slot="start"
          class="tw-me-1"
          [category]="categoryOf(menuItem.type)"
          [size]="22"
          flat
        />
        {{ menuItem.labelKey | i18n }}
      </a>
    }
    @if ((cipherMenuItems$ | async)?.length) {
      <!-- Keykeeper: new items from templates -->
      <a bitMenuItem [routerLink]="['/keykeeper-templates']" [queryParams]="templateQueryParams()">
        <i class="bwi bwi-file-text" slot="start" aria-hidden="true"></i>
        From template
      </a>
      <bit-menu-divider></bit-menu-divider>
    }
    <button type="button" bitMenuItem (click)="openFolderDialog()">
      <i class="bwi bwi-folder" slot="start" aria-hidden="true"></i>
      {{ "folder" | i18n }}
    </button>
  </bit-menu>
}
