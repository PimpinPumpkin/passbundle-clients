<bit-item>
  <button
    bit-item-content
    type="button"
    (click)="openAttachments()"
    [disabled]="parentFormDisabled"
    [title]="'popOutNewWindow' | i18n"
  >
    <div class="tw-flex tw-items-center tw-gap-2">
      {{ "attachments" | i18n }}
      <!-- Keykeeper: the badge says what Premium adds here, and only shows when that's the reason a file can't be added. -->
      @if (attachingOff === "premium") {
        <app-premium-badge [sentence]="attachFilesSentence"></app-premium-badge>
      }
    </div>
    <ng-container slot="end">
      <span class="tw-sr-only">{{ "popOutNewWindow" | i18n }}</span>
      <i class="bwi bwi-popout tw-text-muted" aria-hidden="true"></i>
    </ng-container>
  </button>
</bit-item>
