<!-- Keykeeper: the search is on top of the page; here are the category chips, and
     the other filters (vaults, collections, folders) behind a button when there are any. -->
<div class="tw-flex tw-gap-1 tw-items-center">
  <app-keykeeper-category-chips class="tw-flex-1 tw-min-w-0"></app-keykeeper-category-chips>
  @if (hasMoreFilters$ | async) {
    <div class="tw-relative">
      <button
        type="button"
        bitIconButton="bwi-sliders"
        size="small"
        [buttonType]="'primaryGhost'"
        [bitDisclosureTriggerFor]="disclosureRef"
        [label]="'filterVault' | i18n"
        aria-describedby="filters-applied"
      ></button>
      @if (buttonSupportingText$ | async; as supportingText) {
        <p class="tw-sr-only" id="filters-applied">
          {{ supportingText }}
        </p>
      }
      @if (showBadge$ | async) {
        <div
          class="tw-flex tw-items-center tw-justify-center tw-z-10 tw-absolute tw-rounded-full tw-size-[15px] -tw-top-[3px] -tw-right-[3px] tw-text-notification-600 tw-text-[8px] tw-border-notification-600 tw-border-[0.5px] tw-border-solid tw-bg-notification-100 tw-leading-normal"
          data-testid="filter-badge"
        >
          {{ numberOfAppliedFilters$ | async }}
        </div>
      }
    </div>
  }
</div>
<bit-disclosure
  #disclosureRef
  [open]="initialDisclosureVisibility$ | async"
  (openChange)="toggleFilters($event)"
>
  <app-vault-list-filters></app-vault-list-filters>
</bit-disclosure>
