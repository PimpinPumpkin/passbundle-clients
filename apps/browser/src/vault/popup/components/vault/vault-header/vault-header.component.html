<!-- Keykeeper: the search is on top of the page; here are the category chips and the
     folder filter, every place an item lives grouped by owner (DESIGN.md, "Folders and
     permissions"). The place picked shows as a chip under them, to clear it. -->
<div class="tw-flex tw-gap-1 tw-items-center">
  <app-keykeeper-category-chips class="tw-flex-1 tw-min-w-0"></app-keykeeper-category-chips>
  <app-keykeeper-folder-filter></app-keykeeper-folder-filter>
</div>
@if (pickedPlace$ | async; as place) {
  <div class="tw-mt-2 tw-flex" data-testid="keykeeper-picked-place">
    <span data-kk="picked">
      @if (place.tile) {
        <vault-keykeeper-category-tile
          [look]="place.tile"
          [size]="18"
          data-testid="keykeeper-folder-tile"
        />
      } @else {
        <i class="bwi bwi-fw {{ placeIcon(place) }}" aria-hidden="true"></i>
      }
      <span class="tw-truncate">{{ placeLabel(place) }}</span>
      <button
        type="button"
        bitIconButton="bwi-close"
        size="small"
        [label]="'keykeeperShowAllFolders' | i18n"
        (click)="clearPlace()"
      ></button>
    </span>
  </div>
}
