<bit-item>
  <button
    (click)="selectCipher(cipher)"
    appA11yTitle="{{ title }} - {{ cipher.name }}"
    bit-item-content
    tabindex="0"
    type="button"
  >
    <!-- Keykeeper: the item's tile, as in the vault -->
    <vault-keykeeper-item-tile
      slot="start"
      class="tw-me-1"
      [cipher]="cipher"
    ></vault-keykeeper-item-tile>
    <span data-testid="item-name">
      {{ cipher.name }}
      @if (cipher.organizationId) {
        <bit-icon
          [appA11yTitle]="'shared' | i18n"
          class="tw-text-muted"
          [name]="'bwi-collection-shared' | vfo1Icon"
        />
      }
    </span>
    <ng-container slot="secondary">
      @if (getSubName(cipher)) {
        <div>{{ getSubName(cipher) }}</div>
      }
      @if (cipher.subTitle) {
        <div>{{ cipher.subTitle }}</div>
      }
    </ng-container>
  </button>
</bit-item>
